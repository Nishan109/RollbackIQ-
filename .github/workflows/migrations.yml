name: RollbackIQ migration preflight
on:
  pull_request:
    branches: [main]
    paths: ["examples/demo-saas/migrations/**"]
permissions:
  contents: read
jobs:
  migration-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .rollbackiq-tool
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.rollbackiq-tool/integrations/github-action
        with:
          repo: candidate
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.sha }}
          migration-directory: examples/demo-saas/migrations
          analysis-mode: compatibility
          source-directories: examples/demo-saas/releases/previous/src
          schema-baseline: examples/demo-saas/schema.sql
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rollbackiq-report
          path: rollbackiq-output/
          if-no-files-found: ignore
          retention-days: 7
